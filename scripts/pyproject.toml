[project]
name = "lescc-data"
version = "0.1.0"
description = "Builds static JSON for the LESCC 311 storytelling app from data/ and notebooks/."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "requests>=2.32", "pyproj>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
